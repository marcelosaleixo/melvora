<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Melvora — Login</title><link rel="stylesheet" href="/css/app.css"></head>
<body class="auth-page">
<main class="auth-card">
  <h1>Melvora</h1>
  <p>Gestão inteligente para negócios de beleza.</p>
  <div class="alert" th:if="${param.erro}">E-mail ou senha inválidos.</div>
  <div class="success" th:if="${param.logout}">Sessão encerrada com segurança.</div>
  <form method="post" action="/login">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <label>E-mail<input type="email" name="username" autocomplete="username" required maxlength="180"></label>
    <label>Senha<input type="password" name="password" autocomplete="current-password" required minlength="12"></label>
    <button type="submit">Entrar</button>
  </form>
</main>
</body></html>
