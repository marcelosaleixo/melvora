<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clientes | Melvora</title><link rel="stylesheet" href="/css/app.css"></head><body><div class="app-shell"><aside th:replace="~{fragments/nav :: sidebar}"></aside><main class="main-content"><div class="topbar"><div><span class="eyebrow">RELACIONAMENTO</span><h1>Clientes</h1><p>Cadastre e acompanhe as clientes da sua empresa.</p></div></div><div th:if="${sucesso}" class="flash success" th:text="${sucesso}"></div><div th:if="${erro}" class="flash error" th:text="${erro}"></div><div class="module-layout"><section class="panel"><div class="panel-heading"><div><span class="section-kicker">NOVO CADASTRO</span><h2>Adicionar cliente</h2></div></div><form class="form-grid" method="post" action="/clientes" th:object="${clienteForm}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label>Nome<input th:field="*{nome}" required maxlength="150"></label><label>Telefone<input th:field="*{telefone}" maxlength="30"></label><label>E-mail<input th:field="*{email}" type="email" maxlength="180"></label><label class="full">Observações<textarea th:field="*{observacoes}" maxlength="1000"></textarea></label><button class="primary-button full">Cadastrar cliente</button></form></section><section class="panel"><div class="panel-heading"><div><span class="section-kicker">CADASTRO</span><h2>Clientes ativos</h2></div><span class="section-note" th:text="${pagina.totalElements + ' clientes'}">0 clientes</span></div><div class="table-wrap"><table><thead><tr><th>Nome</th><th>Telefone</th><th>E-mail</th><th>Ações</th></tr></thead><tbody><tr th:each="c : ${pagina.content}"><td><strong th:text="${c.nome}">Nome</strong></td><td th:text="${c.telefone ?: '—'}">—</td><td th:text="${c.email ?: '—'}">—</td><td><a class="table-action" th:href="@{'/mega-hair/historico/' + ${c.id}}">Histórico</a></td></tr><tr th:if="${pagina.empty}"><td colspan="4" class="empty">Nenhuma cliente cadastrada.</td></tr></tbody></table></div></section></div></main></div></body></html>
