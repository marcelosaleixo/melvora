<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="messages">
    <div th:if="${sucesso}" class="flash success" role="status" th:text="${sucesso}"></div>
    <div th:if="${erro}" class="flash error" role="alert" th:text="${erro}"></div>
</th:block>
</body>
</html>
