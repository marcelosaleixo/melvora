<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Produtos | Melvora</title><link rel="stylesheet" href="/css/app.css"></head><body><div class="app-shell"><aside th:replace="~{fragments/nav :: sidebar}"></aside><main class="main-content"><div class="topbar"><div><span class="eyebrow">CATÁLOGO</span><h1>Produtos</h1><p>Produtos comuns e produtos especializados em Mega Hair.</p></div></div><div th:if="${sucesso}" class="flash success" th:text="${sucesso}"></div><div th:if="${erro}" class="flash error" th:text="${erro}"></div><section class="panel"><div class="panel-heading"><div><span class="section-kicker">NOVO PRODUTO</span><h2>Cadastrar produto</h2></div></div><form class="form-grid" method="post" action="/produtos" id="produtoForm"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label>Nome<input name="nome" required maxlength="150"></label><label>Tipo<select name="tipo" id="tipoProduto" required><option th:each="t : ${tipos}" th:value="${t}" th:text="${t}"></option></select></label><label>Preço de custo<input name="precoCusto" type="number" step="0.01" min="0" required></label><label>Preço de venda<input name="precoVenda" type="number" step="0.01" min="0" required></label><div id="megaFields" class="mega-fields full"><div class="section-kicker">DADOS TÉCNICOS MEGA HAIR</div><div class="form-grid nested"><label>Comprimento (cm)<input name="comprimentoCm" type="number" min="1" max="300"></label><label>Peso (g)<input name="pesoGramas" type="number" step="0.01" min="0.01"></label><label>Tipo de fio<select name="tipoFio"><option th:each="f : ${fios}" th:value="${f}" th:text="${f}"></option></select></label><label>Cor<input name="cor" maxlength="80"></label><label>Método<select name="metodo"><option th:each="m : ${metodos}" th:value="${m}" th:text="${m}"></option></select></label><label>Origem<input name="origem" maxlength="100"></label></div></div><button class="primary-button full">Salvar produto</button></form></section><section class="panel"><div class="panel-heading"><div><span class="section-kicker">CATÁLOGO</span><h2>Produtos cadastrados</h2></div></div><div class="table-wrap"><table><thead><tr><th>Produto</th><th>Tipo</th><th>Custo</th><th>Venda</th><th>Status</th></tr></thead><tbody><tr th:each="p : ${pagina.content}"><td><strong th:text="${p.nome}">Produto</strong></td><td th:text="${p.tipo}">MEGA_HAIR</td><td th:text="${'R$ ' + p.precoCusto}">R$ 0</td><td th:text="${'R$ ' + p.precoVenda}">R$ 0</td><td><span class="status active">Ativo</span></td></tr><tr th:if="${pagina.empty}"><td colspan="5" class="empty">Nenhum produto cadastrado.</td></tr></tbody></table></div></section></main></div><script>const t=document.getElementById('tipoProduto'),m=document.getElementById('megaFields');function sync(){m.style.display=t.value==='MEGA_HAIR'?'block':'none'}t.addEventListener('change',sync);sync();</script></body></html>
