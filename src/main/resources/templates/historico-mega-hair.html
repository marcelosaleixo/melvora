<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Histórico | Melvora</title><link rel="stylesheet" href="/css/app.css"></head><body><div class="app-shell"><aside th:replace="~{fragments/nav :: sidebar}"></aside><main class="main-content"><div class="topbar"><div><span class="eyebrow">HISTÓRICO</span><h1 th:text="${cliente.nome}">Cliente</h1><p>Jornada de aplicações e manutenções de Mega Hair.</p></div><a class="secondary-button" href="/clientes">Voltar para clientes</a></div><div class="timeline"><section class="panel"><div class="panel-heading"><div><span class="section-kicker">APLICAÇÕES</span><h2>Aplicações realizadas</h2></div></div><div th:if="${#lists.isEmpty(historico.aplicacoes)}" class="empty">Nenhuma aplicação registrada.</div><article class="history-item" th:each="a : ${historico.aplicacoes}"><div class="history-dot">💇</div><div><strong th:text="${#temporals.format(a.dataAplicacao,'dd/MM/yyyy') + ' · ' + a.profissional}">Data</strong><p th:text="${a.observacoes ?: 'Sem observações.'}">Observações</p><div class="tag-row"><span class="tag" th:each="l : ${a.lotes}" th:text="${l.loteCodigo + ' · ' + l.quantidade + ' un. · ' + l.pesoTotalGramas + ' g'}">Lote</span></div><a class="table-action" th:href="@{'/mega-hair/manutencao/' + ${a.id}}">Registrar manutenção</a></div></article></section><section class="panel"><div class="panel-heading"><div><span class="section-kicker">MANUTENÇÕES</span><h2>Histórico de manutenção</h2></div></div><div th:if="${#lists.isEmpty(historico.manutencoes)}" class="empty">Nenhuma manutenção registrada.</div><article class="history-item" th:each="m : ${historico.manutencoes}"><div class="history-dot">🔄</div><div><strong th:text="${#temporals.format(m.dataManutencao,'dd/MM/yyyy') + ' · ' + m.tipo}">Manutenção</strong><p th:text="${m.profissional + ' · ' + (m.observacoes ?: 'Sem observações.')}">Detalhes</p></div></article></section></div></main></div></body></html>
