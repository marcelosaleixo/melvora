<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head('Clientes')}"></head>
<body>
<th:block th:replace="~{fragments/layout :: layout(~{::main})}">
<main class="main-content">
<header class="topbar"><div><span class="eyebrow">RELACIONAMENTO</span><h1>Clientes</h1><p>Cadastre e acompanhe as clientes da sua empresa.</p></div></header>
<th:block th:replace="~{fragments/feedback :: messages}"></th:block>
<div class="module-layout"><section class="panel"><div class="panel-heading"><div><span class="section-kicker">NOVO CADASTRO</span><h2>Adicionar cliente</h2></div></div><form class="form-grid" method="post" th:action="@{/clientes}" th:object="${clienteForm}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label>Nome<input th:field="*{nome}" required maxlength="150" autocomplete="name"></label><label>Telefone<input th:field="*{telefone}" maxlength="30" autocomplete="tel"></label><label>E-mail<input th:field="*{email}" type="email" maxlength="180" autocomplete="email"></label><label class="full">Observações<textarea th:field="*{observacoes}" maxlength="1000"></textarea></label><button class="primary-button full" type="submit">Cadastrar cliente</button></form></section><section class="panel"><div class="panel-heading"><div><span class="section-kicker">CADASTRO</span><h2>Clientes ativos</h2></div><span class="section-note" th:text="${pagina.totalElements + ' clientes'}">0 clientes</span></div><div class="table-wrap"><table><thead><tr><th>Nome</th><th>Telefone</th><th>E-mail</th><th>Status</th><th>Ações</th></tr></thead><tbody><tr th:each="c : ${pagina.content}"><td><strong th:text="${c.nome}">Nome</strong></td><td th:text="${c.telefone ?: '—'}">—</td><td th:text="${c.email ?: '—'}">—</td><td><span class="status" th:classappend="${c.ativo ? ' active' : ' muted'}" th:text="${c.ativo ? 'Ativa' : 'Inativa'}">Ativa</span></td><td><div class="table-actions"><a class="table-action" th:href="${'/clientes/' + c.id}">Abrir ficha</a><a class="table-action" th:href="${'/clientes/' + c.id + '/editar'}">Editar</a><form sec:authorize="hasRole('ADMIN')" class="inline-form" method="post" th:action="${'/clientes/' + c.id + '/alternar-status'}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="table-action-button" type="submit" th:text="${c.ativo ? 'Desativar' : 'Ativar'}">Desativar</button></form></div></td></tr><tr th:if="${pagina.empty}"><td colspan="5" class="empty">Nenhuma cliente cadastrada.</td></tr></tbody></table></div><th:block th:replace="~{fragments/pagination :: pagination(${pagina}, '/clientes')}"></th:block></section></div>
</main>
</th:block>

</body>
</html>
