<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Editar produto')}"></head>
<body>
<th:block th:replace="~{fragments/layout :: layout(~{::main})}">
<main class="main-content">
<header class="topbar">
    <div><span class="eyebrow">CATÁLOGO</span><h1>Editar produto</h1><p>Atualize os dados do catálogo sem alterar o histórico de estoque.</p></div>
    <a class="secondary-button" th:href="@{/produtos}">Voltar</a>
</header>
<th:block th:replace="~{fragments/feedback :: messages}"></th:block>

<section class="panel narrow">
<form class="form-grid" method="post" th:action="@{'/produtos/' + produtoId + '/editar'}" th:object="${produtoForm}" novalidate>
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
<label class="field">Nome<input th:field="*{nome}" maxlength="150" required th:classappend="${#fields.hasErrors('nome')} ? ' input-error' : ''"><small class="field-error" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></small></label>
<label class="field">Tipo<select th:field="*{tipo}" id="tipoProduto" required><option value="">Selecione</option><option th:each="t : ${tipos}" th:value="${t}" th:text="${t}"></option></select><small class="field-error" th:if="${#fields.hasErrors('tipo')}" th:errors="*{tipo}"></small></label>
<label class="field">Preço de custo<input th:field="*{precoCusto}" type="number" step="0.01" min="0" required><small class="field-error" th:if="${#fields.hasErrors('precoCusto')}" th:errors="*{precoCusto}"></small></label>
<label class="field">Preço de venda<input th:field="*{precoVenda}" type="number" step="0.01" min="0" required><small class="field-error" th:if="${#fields.hasErrors('precoVenda')}" th:errors="*{precoVenda}"></small></label>
<div id="megaFields" class="mega-fields full" hidden><div class="section-kicker">DADOS TÉCNICOS MEGA HAIR</div><div class="form-grid nested">
<label class="field">Comprimento (cm)<input th:field="*{comprimentoCm}" type="number" min="1" max="300"><small class="field-error" th:if="${#fields.hasErrors('comprimentoCm')}" th:errors="*{comprimentoCm}"></small></label>
<label class="field">Peso (g)<input th:field="*{pesoGramas}" type="number" step="0.01" min="0.01"><small class="field-error" th:if="${#fields.hasErrors('pesoGramas')}" th:errors="*{pesoGramas}"></small></label>
<label class="field">Tipo de fio<select th:field="*{tipoFio}"><option value="">Selecione</option><option th:each="f : ${fios}" th:value="${f}" th:text="${f}"></option></select></label>
<label class="field">Cor<input th:field="*{cor}" maxlength="80"><small class="field-error" th:if="${#fields.hasErrors('cor')}" th:errors="*{cor}"></small></label>
<label class="field">Método<select th:field="*{metodo}"><option value="">Selecione</option><option th:each="m : ${metodos}" th:value="${m}" th:text="${m}"></option></select></label>
<label class="field">Origem<input th:field="*{origem}" maxlength="100"><small class="field-error" th:if="${#fields.hasErrors('origem')}" th:errors="*{origem}"></small></label>
</div></div>
<button class="primary-button full" type="submit">Salvar alterações</button>
</form>
</section>
</main>
</th:block>
<script defer th:src="@{/js/produtos.js}"></script>
</body>
</html>
