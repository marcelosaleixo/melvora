<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Editar agendamento')}"></head>
<body>
<th:block th:replace="~{fragments/layout :: layout(~{::main})}">
<main class="main-content">
<header class="topbar">
  <div><span class="eyebrow">AGENDA</span><h1>Editar agendamento</h1><p>Altere o horário e os dados do atendimento sem perder o histórico.</p></div>
  <a class="secondary-button" th:href="@{/agenda(data=${agendamento.dataHoraInicio.toLocalDate()})}">← Voltar para agenda</a>
</header>
<th:block th:replace="~{fragments/feedback :: messages}"></th:block>
<section class="panel agenda-edit-panel">
  <div class="panel-heading"><div><span class="section-kicker">ATENDIMENTO</span><h2 th:text="${agendamento.cliente.nome}">Cliente</h2><p class="section-note" th:text="${agendamento.profissional.nome}">Profissional</p></div><span class="status-badge" th:text="${agendamento.status.nome}">Agendado</span></div>
  <form class="form-grid" method="post" th:action="@{/agenda/{id}/editar(id=${agendamento.id})}" th:object="${agendaEdicao}">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <div class="field full"><label for="tipo">Tipo de atendimento</label><select id="tipo" th:field="*{tipo}" required><option value="">Selecione</option><option th:each="t : ${tipos}" th:value="${t}" th:text="${t.nome}"></option></select><small th:if="${#fields.hasErrors('tipo')}" class="field-error" th:errors="*{tipo}"></small></div>
    <div class="field full" th:if="${servicosAtivo}"><label for="servicoId">Serviço / procedimento</label><select id="servicoId" th:field="*{servicoId}"><option value="">Nenhum serviço específico</option><option th:each="s : ${servicos}" th:value="${s.id}" th:attr="data-duration=${s.duracaoMinutos}" th:text="${s.nome + ' · ' + s.duracaoMinutos + ' min · R$ ' + #numbers.formatDecimal(s.preco,1,2)}"></option></select><small>A duração cadastrada no serviço define automaticamente o horário final.</small></div>
    <div class="field"><label for="dataHoraInicio">Início</label><input id="dataHoraInicio" th:field="*{dataHoraInicio}" type="datetime-local" required><small th:if="${#fields.hasErrors('dataHoraInicio')}" class="field-error" th:errors="*{dataHoraInicio}"></small></div>
    <div class="field"><label for="dataHoraFim">Fim</label><input id="dataHoraFim" th:field="*{dataHoraFim}" type="datetime-local" required><small th:if="${#fields.hasErrors('dataHoraFim')}" class="field-error" th:errors="*{dataHoraFim}"></small></div>
    <div class="field full"><label for="observacoes">Observações</label><textarea id="observacoes" th:field="*{observacoes}" maxlength="2000"></textarea><small th:if="${#fields.hasErrors('observacoes')}" class="field-error" th:errors="*{observacoes}"></small></div>
    <button class="primary-button full" type="submit">Salvar alterações</button>
  </form>
</section>
<script>
(function(){
  const service = document.getElementById('servicoId');
  const start = document.getElementById('dataHoraInicio');
  const end = document.getElementById('dataHoraFim');
  if (!service || !start || !end) return;
  function sync(){
    const option = service.options[service.selectedIndex];
    const minutes = option && option.dataset.duration ? Number(option.dataset.duration) : 0;
    if (!minutes || !start.value) return;
    const date = new Date(start.value);
    date.setMinutes(date.getMinutes() + minutes);
    const pad = n => String(n).padStart(2,'0');
    end.value = date.getFullYear() + '-' + pad(date.getMonth()+1) + '-' + pad(date.getDate()) + 'T' + pad(date.getHours()) + ':' + pad(date.getMinutes());
  }
  service.addEventListener('change', sync);
  start.addEventListener('change', sync);
})();
</script>
</main>
</th:block>
</body>
</html>
