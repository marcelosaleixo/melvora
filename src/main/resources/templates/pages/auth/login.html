<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Login')}"></head>
<body class="auth-page">
<main class="auth-card" aria-labelledby="login-title">
<h1 id="login-title">Melvora</h1><p>Gestão inteligente para negócios de beleza.</p>
<div class="alert" th:if="${param.erro}" role="alert">E-mail ou senha inválidos.</div><div class="success" th:if="${param.logout}" role="status">Sessão encerrada com segurança.</div>
<form method="post" th:action="@{/login}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label for="username">E-mail<input id="username" type="email" name="username" autocomplete="username" required maxlength="180"></label><label for="password">Senha<input id="password" type="password" name="password" autocomplete="current-password" required minlength="12" maxlength="128"></label><button type="submit">Entrar</button></form>
</main></body></html>
