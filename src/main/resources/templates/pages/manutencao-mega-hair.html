<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head('Manutenção Mega Hair')}"></head>
<body>
<th:block th:replace="~{fragments/layout :: layout(~{::main})}">
<main class="main-content">
<header class="topbar"><div><span class="eyebrow">MEGA HAIR</span><h1>Registrar manutenção</h1><p>Atualize a jornada da aplicação selecionada.</p></div></header><section class="panel narrow"><div th:if="${agendamentoContexto != null}" class="alert success"><strong>Atendimento concluído.</strong> Manutenção vinculada ao agendamento de <span th:text="${agendamentoContexto.cliente.nome}"></span>.</div><form class="form-grid" method="post" th:action="${'/mega-hair/manutencao/' + aplicacaoId}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input th:if="${agendamentoId != null}" type="hidden" name="agendamentoId" th:value="${agendamentoId}"><label>Profissional<select name="profissionalId" required><option value="">Selecione</option><option th:each="p : ${profissionais}" th:value="${p.id}" th:text="${p.nome}" th:selected="${agendamentoContexto != null and p.id == agendamentoContexto.profissional.id}"></option></select></label><label>Tipo<select name="tipo" required><option th:each="t : ${tiposManutencao}" th:value="${t}" th:text="${t}"></option></select></label><label>Data<input name="dataManutencao" type="date" required th:value="${agendamentoContexto != null ? #temporals.format(agendamentoContexto.dataHoraInicio, 'yyyy-MM-dd') : #temporals.format(#temporals.createToday(), 'yyyy-MM-dd')}"></label><label class="full">Observações<textarea name="observacoes" maxlength="2000"></textarea></label><button class="primary-button full" type="submit">Registrar manutenção</button></form></section>
</main>
</th:block>

</body>
</html>
