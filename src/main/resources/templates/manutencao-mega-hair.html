<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manutenção | Melvora</title><link rel="stylesheet" href="/css/app.css"></head><body><div class="app-shell"><aside th:replace="~{fragments/nav :: sidebar}"></aside><main class="main-content"><div class="topbar"><div><span class="eyebrow">MEGA HAIR</span><h1>Registrar manutenção</h1><p>Atualize a jornada da aplicação selecionada.</p></div></div><section class="panel narrow"><form class="form-grid" method="post" th:action="@{'/mega-hair/manutencao/' + ${aplicacaoId}}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label>Profissional<select name="profissionalId" required><option th:each="p : ${profissionais}" th:value="${p.id}" th:text="${p.nome}"></option></select></label><label>Tipo<select name="tipo" required><option th:each="t : ${tiposManutencao}" th:value="${t}" th:text="${t}"></option></select></label><label>Data<input name="dataManutencao" type="date" required></label><label class="full">Observações<textarea name="observacoes" maxlength="2000"></textarea></label><button class="primary-button full">Registrar manutenção</button></form></section></main></div></body></html>
