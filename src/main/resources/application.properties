# ============================================================
# MELVORA - Configuração comum
# Valores sensíveis e ambiente de produção são fornecidos pelo EasyPanel.
# ============================================================
spring.application.name=melvora

# Banco PostgreSQL. DB_URL deve conter o host real do serviço PostgreSQL.
spring.datasource.url=${DB_URL:jdbc:postgresql://72.60.59.55:5432/melvora}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:@aleixoPr0}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.initialization-fail-timeout=60000

# JPA/Hibernate gerencia criação/atualização não destrutiva das tabelas.
# Não usar validate: ele impede a inicialização quando falta uma tabela.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# Flyway desativado porque este projeto usa JPA para reconciliar o schema.
# Para migrar para Flyway no futuro, criar baseline/migrations completas antes de ativá-lo.
spring.flyway.enabled=${FLYWAY_ENABLED:false}

# Servidor: EasyPanel deve encaminhar para a mesma porta configurada aqui.
server.port=${SERVER_PORT:${PORT:8086}}
server.forward-headers-strategy=framework

# Thymeleaf e cookies
spring.thymeleaf.cache=${THYMELEAF_CACHE:true}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=lax

# Respostas de erro sem detalhes internos em produção
spring.web.error.include-message=never
spring.web.error.include-binding-errors=never
spring.web.error.include-stacktrace=never
spring.web.error.include-exception=false

# Bootstrap inicial de usuários e empresa
melvora.bootstrap.enabled=${MELVORA_BOOTSTRAP_ENABLED:true}
melvora.bootstrap.master-email=${MELVORA_BOOTSTRAP_MASTER_EMAIL:master@melvora.local}
melvora.bootstrap.master-password=${MELVORA_BOOTSTRAP_MASTER_PASSWORD:}
melvora.bootstrap.master-name=${MELVORA_BOOTSTRAP_MASTER_NAME:Administrador Master}
melvora.bootstrap.company-name=${MELVORA_BOOTSTRAP_COMPANY_NAME:Empresa Inicial}
melvora.bootstrap.admin-email=${MELVORA_BOOTSTRAP_ADMIN_EMAIL:admin@melvora.local}
melvora.bootstrap.admin-password=${MELVORA_BOOTSTRAP_ADMIN_PASSWORD:}
melvora.bootstrap.admin-name=${MELVORA_BOOTSTRAP_ADMIN_NAME:Administrador}

# Segredos e integrações
melvora.security.secret-key=${MELVORA_SECRET_KEY:}
melvora.whatsapp.webhook-verify-token=${MELVORA_WHATSAPP_WEBHOOK_VERIFY_TOKEN:}
melvora.public-base-url=${MELVORA_PUBLIC_BASE_URL:}
