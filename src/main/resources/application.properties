
# =====================================================
# MELVORA - CONFIGURAÇÃO PRINCIPAL
# =====================================================

spring.application.name=melvora

# PostgreSQL - variáveis fornecidas pelo EasyPanel
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/melvora}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool de conexões
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# =====================================================
# JPA / HIBERNATE
# =====================================================

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# =====================================================
# FLYWAY - GERENCIAMENTO DO ESQUEMA
# =====================================================

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

# =====================================================
# THYMELEAF
# =====================================================

spring.thymeleaf.cache=${THYMELEAF_CACHE:true}

# =====================================================
# SERVIDOR
# =====================================================

server.port=${SERVER_PORT:8086}

# =====================================================
# SESSÃO / SEGURANÇA
# =====================================================

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=lax

# =====================================================
# BOOTSTRAP INICIAL
# =====================================================

melvora.bootstrap.enabled=${MELVORA_BOOTSTRAP_ENABLED:true}
melvora.bootstrap.master-email=${MELVORA_BOOTSTRAP_MASTER_EMAIL:master@melvora.local}
melvora.bootstrap.master-password=${MELVORA_BOOTSTRAP_MASTER_PASSWORD:}
melvora.bootstrap.master-name=${MELVORA_BOOTSTRAP_MASTER_NAME:Administrador Master}

melvora.bootstrap.company-name=${MELVORA_BOOTSTRAP_COMPANY_NAME:Salão Demonstração}
melvora.bootstrap.admin-email=${MELVORA_BOOTSTRAP_ADMIN_EMAIL:admin@salaodemo.local}
melvora.bootstrap.admin-password=${MELVORA_BOOTSTRAP_ADMIN_PASSWORD:}
melvora.bootstrap.admin-name=${MELVORA_BOOTSTRAP_ADMIN_NAME:Administrador}

# =====================================================
# WHATSAPP / INTEGRAÇÕES
# =====================================================

melvora.security.secret-key=${MELVORA_SECRET_KEY:}
melvora.whatsapp.webhook-verify-token=${MELVORA_WHATSAPP_WEBHOOK_VERIFY_TOKEN:}
melvora.public-base-url=${MELVORA_PUBLIC_BASE_URL:}