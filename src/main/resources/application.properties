# ============================================================
# MELVORA - Ambiente local
# Spring Boot 4.x / Java 21 / PostgreSQL / Flyway
# ============================================================

spring.application.name=melvora

# PostgreSQL local
#spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/melvora?sslmode=disable}
spring.datasource.url=${DB_URL:jdbc:postgresql://72.60.59.55:5432/melvora?sslmode=disable}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:@aleixoPr0}

spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA: o schema é controlado exclusivamente pelo Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.show-sql=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

# Thymeleaf
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}

# Servidor
server.port=${SERVER_PORT:8080}

# Sessão local
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax

# Tratamento seguro de erros - Spring Boot 4.x
spring.web.error.include-message=never
spring.web.error.include-binding-errors=never
spring.web.error.include-stacktrace=never
spring.web.error.include-exception=false
spring.web.error.include-path=always

# ============================================================
# Bootstrap inicial
#
# Se as senhas forem deixadas vazias, o sistema gera senhas
# aleatórias fortes e mostra as credenciais uma única vez no log
# durante a criação inicial.
# ============================================================
melvora.bootstrap.enabled=${MELVORA_BOOTSTRAP_ENABLED:true}
melvora.bootstrap.master-email=${MELVORA_BOOTSTRAP_MASTER_EMAIL:master@melvora.local}
melvora.bootstrap.master-password=${MELVORA_BOOTSTRAP_MASTER_PASSWORD:}
melvora.bootstrap.master-name=${MELVORA_BOOTSTRAP_MASTER_NAME:Administrador Master}
melvora.bootstrap.company-name=${MELVORA_BOOTSTRAP_COMPANY_NAME:Salão Demonstração}
melvora.bootstrap.admin-email=${MELVORA_BOOTSTRAP_ADMIN_EMAIL:admin@salaodemo.local}
melvora.bootstrap.admin-password=${MELVORA_BOOTSTRAP_ADMIN_PASSWORD:}
melvora.bootstrap.admin-name=${MELVORA_BOOTSTRAP_ADMIN_NAME:Administrador}

# ============================================================
# WhatsApp Business / Cloud API
# Token por empresa fica criptografado no banco. A chave AES-256
# deve ser fornecida por variável de ambiente, nunca no código.
# Gere uma chave Base64 de 32 bytes e defina MELVORA_SECRET_KEY.
# ============================================================
melvora.security.secret-key=${MELVORA_SECRET_KEY:}
melvora.whatsapp.webhook-verify-token=${MELVORA_WHATSAPP_WEBHOOK_VERIFY_TOKEN:}

# URL pública do Melvora, usada para webhooks dos provedores WhatsApp.
# Exemplo: https://app.seudominio.com
melvora.public-base-url=${MELVORA_PUBLIC_BASE_URL:}
