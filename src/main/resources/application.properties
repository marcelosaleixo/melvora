# ==========================================
# CONFIGURAÇÕES DO SERVIDOR E APLICAÇÃO
# ==========================================
server.port=8090

# Uploads de identidade visual (logo/favicons)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# O Tomcat possui limites próprios para POSTs e para descarte do corpo da requisição.
# Eles precisam ser maiores que o limite multipart para evitar HTTP 413 antes do Spring MVC.
server.tomcat.max-http-form-post-size=20MB
server.tomcat.max-swallow-size=20MB
spring.application.name=melvora

# Configuração de fuso horário local (Mato Grosso) para garantir 
# que os registros de chamados e manutenções fiquem com a hora exata.
spring.jackson.time-zone=America/Cuiaba
spring.jpa.properties.hibernate.jdbc.time_zone=America/Cuiaba

# ==========================================
# CONFIGURAÇÃO DO BANCO DE DADOS POSTGRESQL
# ==========================================
# Crie um banco de dados chamado "hospital_manutencao" no seu PGAdmin
#postgres://postgres:@aleixoPr0@72.60.59.55:5432/aleixopro_db?sslmode=disable
spring.datasource.url=jdbc:postgresql://72.60.59.55:5432/melvora?sslmode=disable
spring.datasource.username=postgres
spring.datasource.password=@aleixoPr0
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# CONFIGURAÇÕES DO SPRING DATA JPA / HIBERNATE
# ==========================================
# 'update' cria e atualiza as tabelas automaticamente baseado nas suas Entidades.
# (Em produção, o ideal é usar 'validate' ou ferramentas como Flyway/Liquibase).
spring.jpa.hibernate.ddl-auto=update

# Dialeto do PostgreSQL para que o Hibernate monte os SQLs corretamente
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Mostra as queries SQL no console do Java (ajuda muito a debugar)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# CONFIGURAÇÕES DO THYMELEAF
# ==========================================
# Desativa o cache no desenvolvimento. Isso permite que você altere os 
# arquivos HTML e veja o resultado no navegador apenas recarregando a página, 
# sem precisar reiniciar o servidor Spring Boot.
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

app.platform-admin.username=${PLATFORM_ADMIN_USERNAME:}

# ==========================================
# BOOTSTRAP DA PRIMEIRA INSTALAÇÃO
# ==========================================
# Se a base estiver vazia, cria automaticamente a empresa da plataforma e o
# primeiro SUPER ADMIN. Depois que existir qualquer usuário, não recria contas.
# Em produção, prefira definir estes valores por variáveis de ambiente.
melvora.bootstrap.enabled=${MELVORA_BOOTSTRAP_ENABLED:true}
melvora.bootstrap.master-email=${MELVORA_BOOTSTRAP_MASTER_EMAIL:master@melvora.local}
melvora.bootstrap.master-password=${MELVORA_BOOTSTRAP_MASTER_PASSWORD:}
melvora.bootstrap.master-name=${MELVORA_BOOTSTRAP_MASTER_NAME:Administrador Master}
melvora.bootstrap.company-name=${MELVORA_BOOTSTRAP_COMPANY_NAME:Salão Demonstração}
melvora.bootstrap.admin-email=${MELVORA_BOOTSTRAP_ADMIN_EMAIL:admin@salaodemo.local}
melvora.bootstrap.admin-password=${MELVORA_BOOTSTRAP_ADMIN_PASSWORD:}
melvora.bootstrap.admin-name=${MELVORA_BOOTSTRAP_ADMIN_NAME:Administrador}